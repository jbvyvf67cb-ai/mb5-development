<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>MB5 — Globe (working title)</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0e14;
        /* iOS-safe: stop the browser from hijacking touch gestures (see DESIGN.md). */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
      }
      #app {
        width: 100vw;
        height: 100vh;
        display: block;
        outline: none;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #cdd6f4;
        font: 600 18px/1.4 system-ui, sans-serif;
        letter-spacing: 0.04em;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <canvas id="app" touch-action="none"></canvas>
    <div id="boot">Loading world…</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
